<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
<script>
/* 카카오톡·네이버·페이스북·인스타그램·라인·밴드 등 앱 안 브라우저로 열리면 기본 브라우저(크롬·사파리)로 다시 열기 */
(function () {
  if (window.top !== window.self) return;
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|KAKAOSTORY|NAVER\(inapp|NAVER\/|FBAN|FBAV|FB_IAB|FBIOS|Instagram|\bLine\/|DaumApps|BAND\/|everytimeApp|Whale\/[\d.]+ .*inapp|; wv\)/i.test(ua);
  if (!inApp) return;
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/\bLine\//i.test(ua)) {
    if (url.indexOf('openExternalBrowser=1') < 0) location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
    return;
  }
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    return;
  }
  // 아이폰의 앱 안 브라우저는 사파리로 바로 넘길 수 없어 안내 화면을 띄움
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(20,24,32,.94);color:#f2f3f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 -apple-system,system-ui,sans-serif;word-break:keep-all';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 소리나 화면이 제대로 작동하지 않을 수 있어요.<br>오른쪽 아래 ⋯ 또는 공유 버튼에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button type="button" data-a="copy" style="font:inherit;padding:10px 20px;border-radius:999px;border:0;background:#f2f3f6;color:#141820">주소 복사</button>' +
      '<button type="button" data-a="stay" style="font:inherit;background:none;border:0;color:#aab0bd;text-decoration:underline">그냥 여기서 보기</button>';
    box.addEventListener('click', function (e) {
      var a = e.target.getAttribute && e.target.getAttribute('data-a');
      if (a === 'stay') box.remove();
      if (a === 'copy') {
        var b = e.target;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
          function () { b.textContent = '복사했어요'; },
          function () { window.prompt('주소를 복사해 사파리에 붙여 넣어 주세요', url); });
      }
    });
    document.body.appendChild(box);
  });
})();
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Numbers - 수 막대 순간 포착!</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body class="light-mode">
    <!-- 인앱 브라우저 경고 오버레이 -->
    <div id="inapp-guide">
        <h2>⚠️ 인앱 브라우저 감지됨</h2>
        <p>카카오톡, 페이스북 등의 앱 내장 브라우저에서는<br>화면 크기나 효과음 기능이 정상적으로 작동하지 않을 수 있습니다.</p>
        <p>원활한 사용을 위해 우측 하단(또는 상단)의 메뉴 버튼 <strong>[⋮]</strong> 을 눌러<br><strong style="color:#00f0ff;">'다른 브라우저로 열기 (Safari/Chrome 등)'</strong>를 선택해 주시거나,<br>아래 버튼을 눌러 링크를 복사하세요.</p>
        <div style="display:flex; gap:15px; margin-top:20px;">
            <button id="btn-copy-link" class="btn btn-secondary">링크 복사하기</button>
            <button class="btn btn-accent" onclick="document.getElementById('inapp-guide').style.display='none'">무시하고 계속</button>
        </div>
    </div>

    <div id="app">
        <!-- 메인 화면 (수 막대 및 정답 표시) -->
        <div id="display-area" class="hidden-state">
            <div id="blocks-container" class="glass-panel">
                <div id="tens-container"></div>
                <div id="ones-container"></div>
            </div>
            <div id="answer-display" class="hidden">
                <span id="answer-number"></span>
            </div>
        </div>

        <!-- 하단 컨트롤 패널 -->
        <div id="control-panel">
            <div class="settings-group">
                <button id="btn-theme-toggle" class="btn-icon" title="다크 모드 / 라이트 모드 전환">
                    <svg id="icon-moon" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
                <button id="btn-sound-toggle" class="btn-icon" title="효과음 켜기/끄기">
                    <svg id="icon-sound-on" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    <svg id="icon-sound-off" style="display:none;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="1" x2="1" y2="23"></line></svg>
                </button>
                <select id="mode-select" class="dropdown" title="노출할 컨텐츠의 종류를 선택합니다.">
                    <option value="blocks">수 막대</option>
                    <option value="stones">바둑돌</option>
                    <option value="frames">십 배열표</option>
                    <option value="connect">연결 막대</option>
                    <option value="random">랜덤 (무작위)</option>
                </select>
                <div class="status-info">
                    <span>노출 시간:</span>
                    <div class="duration-controls">
                        <button id="btn-duration-minus" class="btn-icon" title="시간 줄이기">-</button>
                        <strong id="duration-display">1.5</strong><span>초</span>
                        <button id="btn-duration-plus" class="btn-icon" title="시간 늘리기">+</button>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button id="btn-next" class="btn btn-accent" title="새로운 숫자를 생성하고 설정된 노출 시간으로 초기화합니다.">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M2.13 15.57a9 9 0 1 0 3.87-11.24L21.5 8"></path></svg>
                    다음 문제
                </button>
                <button id="btn-flash" class="btn btn-primary" title="설정된 시간만큼 보여주고 숨깁니다.">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    보여주기 (Flash)
                </button>
                <button id="btn-reveal" class="btn btn-secondary" title="정답 숫자를 화면에 표시합니다.">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                    정답 확인
                </button>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
